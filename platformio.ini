[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/Adafruit BMP280 Library @ ^2.6.8
build_flags =
    -DCORE_DEBUG_LEVEL=3

[env:esp32dev]
build_src_filter =
    +<*>
    -<sim/>

[env:trigger_sim]
build_src_filter =
    +<sim/>
